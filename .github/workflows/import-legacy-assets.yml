name: Import legacy NAP binary assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-legacy-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout legacy source repository
        uses: actions/checkout@v4
        with:
          repository: Boltotelli/welcome-nrw
          ref: main
          path: source

      - name: Copy alliance badges
        shell: bash
        run: |
          mkdir -p target/assets/alliance
          cp source/nap-event-tracker/assets/alliance/*.png target/assets/alliance/

      - name: Commit imported binary assets
        shell: bash
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alliance/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import production alliance badge assets"
          git push
