name: Import development NAP binary assets

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/import-dev-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: target

      - name: Checkout legacy development source
        uses: actions/checkout@v4
        with:
          repository: Boltotelli/welcome-nrw
          ref: fix/nap2-navigation-mobile
          path: source

      - name: Copy development alliance badges
        shell: bash
        run: |
          mkdir -p target/assets/alliance
          cp source/nap-event-tracker-test/assets/alliance/*.png target/assets/alliance/

      - name: Commit imported development assets
        shell: bash
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alliance/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import development alliance badge assets"
          git push origin develop
